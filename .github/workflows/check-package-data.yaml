# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  pull_request:
    paths:
      - "inst/units/**"
      - "data-raw/data-transfer.R"
      - "R/sysdata.rda"

name: check-package-data

permissions: read-all

jobs:
  check-data-freshness:
    runs-on: ubuntu-latest
    name: check-data-freshness
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::usethis
            local::.
          needs: check

      - name: Regenerate package data
        run: |
          pkgload::load_all(".", export_all = FALSE)
          source("data-raw/data-transfer.R")
        shell: Rscript {0}

      - name: Check package data freshness
        run: |
          if ! git diff --exit-code -- R/sysdata.rda; then
            echo '::error file=R/sysdata.rda::R/sysdata.rda is out of date. Run source("data-raw/data-transfer.R") and commit the updated file before merging.'
            exit 1
          fi
        shell: bash
